name: GitHub Streak Stats

on:
  schedule:
    # Runs every day at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  generate-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Download streak SVG from demolab
        run: |
          curl -sL \
            "https://streak-stats.demolab.com/?user=aryanf192811-eng\
&theme=tokyonight\
&hide_border=true\
&date_format=j%20M%5B%20Y%5D\
&background=0D1117\
&stroke=1D4ED8\
&ring=7C3AED\
&fire=EC4899\
&currStreakLabel=58A6FF" \
            -o streak.svg

          # Verify the file is a valid SVG (not an error page)
          if grep -q '<svg' streak.svg; then
            echo "✅ SVG generated successfully"
          else
            echo "❌ SVG generation failed — keeping previous version"
            git checkout -- streak.svg 2>/dev/null || true
          fi

      - name: Commit & push streak SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add streak.svg
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update streak stats [skip ci]" && git push
