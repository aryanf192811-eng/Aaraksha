<svg width="1600" height="740" viewBox="0 0 1600 740" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Consolas', monospace">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowBlueStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="740" fill="#f8fafc"/>
  <rect x="1" y="1" width="1598" height="738" fill="none" stroke="#e2e8f0" stroke-width="2" rx="16"/>

  <!-- corner tag -->
  <text x="40" y="46" fill="#94a3b8" font-size="13" letter-spacing="2">AARAKSHA — SYSTEM ARCHITECTURE</text>
  <text x="1560" y="46" fill="#94a3b8" font-size="13" text-anchor="end" letter-spacing="1">4 PORTALS · 1 BACKEND</text>

  <!-- ============ TIER 1 : CLIENT LAYER ============ -->
  <text x="800" y="82" fill="#94a3b8" font-size="12" text-anchor="middle" letter-spacing="3">CLIENT LAYER</text>

  <!-- Tourist PWA -->
  <g>
    <rect x="104" y="92" width="330" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="128" cy="118" r="6" fill="#f59e0b"/>
    <text x="144" y="123" fill="#0f172a" font-size="17" font-weight="700">Tourist PWA</text>
    <text x="128" y="150" fill="#475569" font-size="12.5">React + Vite · offline-first</text>
    <text x="128" y="172" fill="#94a3b8" font-size="11.5">SOS · Dead Man's Switch · check-in</text>
  </g>

  <!-- Guardian Portal -->
  <g>
    <rect x="458" y="92" width="330" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="482" cy="118" r="6" fill="#059669"/>
    <text x="498" y="123" fill="#0f172a" font-size="17" font-weight="700">Guardian Portal</text>
    <text x="482" y="150" fill="#475569" font-size="12.5">Tokenized link · no login</text>
    <text x="482" y="172" fill="#94a3b8" font-size="11.5">Family view · live rescue status</text>
  </g>

  <!-- Govt Command Center -->
  <g>
    <rect x="812" y="92" width="330" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="836" cy="118" r="6" fill="#2563eb"/>
    <text x="852" y="123" fill="#0f172a" font-size="17" font-weight="700">Govt Command Center</text>
    <text x="836" y="150" fill="#475569" font-size="12.5">Live ops map · district risk</text>
    <text x="836" y="172" fill="#94a3b8" font-size="11.5">Assigns rescue teams &amp; volunteers</text>
  </g>

  <!-- Volunteer App -->
  <g>
    <rect x="1166" y="92" width="330" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="1190" cy="118" r="6" fill="#9333ea"/>
    <text x="1206" y="123" fill="#0f172a" font-size="17" font-weight="700">Volunteer App</text>
    <text x="1190" y="150" fill="#475569" font-size="12.5">Verified local responders</text>
    <text x="1190" y="172" fill="#94a3b8" font-size="11.5">Job dispatch · live GPS</text>
  </g>

  <!-- ============ BUS / SPINE ============ -->
  <line x1="269" y1="192" x2="269" y2="246" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="623" y1="192" x2="623" y2="246" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="977" y1="192" x2="977" y2="246" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="1331" y1="192" x2="1331" y2="246" stroke="#2563eb" stroke-width="2.5"/>

  <line x1="269" y1="246" x2="1331" y2="246" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="269" cy="246" r="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="623" cy="246" r="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="977" cy="246" r="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="1331" cy="246" r="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>

  <rect x="605" y="266" width="390" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="800" y="284" fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">SOCKET.IO — REALTIME SPINE</text>

  <!-- trunk down to backend core, bidirectional -->
  <line x1="800" y1="246" x2="800" y2="335" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrowBlueStart)" marker-end="url(#arrowBlue)"/>
  <rect x="812" y="296" width="272" height="22" rx="6" fill="#f8fafc"/>
  <text x="948" y="311" fill="#3b6cc9" font-size="11" text-anchor="middle">SOS · check-in · assign rescuer · live GPS</text>

  <!-- ============ TIER 2 : BACKEND CORE ============ -->
  <rect x="430" y="335" width="740" height="295" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75"/>
  <text x="458" y="368" fill="#b45309" font-size="13" font-weight="700" letter-spacing="2">AARAKSHA BACKEND</text>
  <text x="458" y="388" fill="#92752f" font-size="12">Express.js · PostgreSQL · one source of truth</text>

  <!-- REST API hub pill -->
  <rect x="1010" y="352" width="130" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1075" y="383" fill="#1d4ed8" font-size="14" font-weight="700" text-anchor="middle">REST API</text>

  <!-- branch from REST API down to 3 service pills -->
  <line x1="800" y1="404" x2="800" y2="430" stroke="#94836a" stroke-width="2"/>
  <line x1="565" y1="430" x2="1035" y2="430" stroke="#94836a" stroke-width="2"/>
  <line x1="565" y1="430" x2="565" y2="452" stroke="#94836a" stroke-width="2"/>
  <line x1="800" y1="430" x2="800" y2="452" stroke="#94836a" stroke-width="2"/>
  <line x1="1035" y1="430" x2="1035" y2="452" stroke="#94836a" stroke-width="2"/>
  <line x1="1075" y1="404" x2="1075" y2="416" stroke="#94836a" stroke-width="2"/>
  <line x1="1075" y1="416" x2="800" y2="416" stroke="#94836a" stroke-width="2"/>
  <line x1="800" y1="416" x2="800" y2="430" stroke="#94836a" stroke-width="2"/>

  <!-- DMS cron -->
  <rect x="460" y="452" width="210" height="98" rx="10" fill="#ffffff" stroke="#e6d3a3" stroke-width="1.5"/>
  <text x="565" y="480" fill="#0f172a" font-size="13.5" font-weight="700" text-anchor="middle">node-cron</text>
  <text x="565" y="499" fill="#334155" font-size="13" text-anchor="middle">Dead Man's Switch</text>
  <text x="565" y="524" fill="#94a3b8" font-size="11" text-anchor="middle">checked every 60 seconds</text>

  <!-- Postgres cylinder -->
  <g>
    <path d="M 695 462 a 105 14 0 0 1 210 0 v 68 a 105 14 0 0 1 -210 0 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <ellipse cx="800" cy="462" rx="105" ry="14" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="800" y="505" fill="#0f172a" font-size="13.5" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="800" y="525" fill="#5c789e" font-size="11" text-anchor="middle">13-table schema</text>
  </g>

  <!-- TSI cron -->
  <rect x="930" y="452" width="210" height="98" rx="10" fill="#ffffff" stroke="#e6d3a3" stroke-width="1.5"/>
  <text x="1035" y="480" fill="#0f172a" font-size="13.5" font-weight="700" text-anchor="middle">node-cron</text>
  <text x="1035" y="499" fill="#334155" font-size="13" text-anchor="middle">Travel Safety Index</text>
  <text x="1035" y="524" fill="#94a3b8" font-size="11" text-anchor="middle">refreshed hourly · live weather</text>

  <!-- caption inside core, bottom -->
  <text x="800" y="600" fill="#92752f" font-size="11.5" text-anchor="middle">rescuer position pushed back to Tourist PWA + Guardian Portal via MapLibre + OSRM</text>

  <!-- ============ OFFLINE LANE ============ -->
  <rect x="60" y="404" width="300" height="112" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="86" y="432" fill="#b45309" font-size="12" font-weight="700" letter-spacing="1.5">OFFLINE PATH</text>
  <text x="86" y="458" fill="#0f172a" font-size="15.5" font-weight="700">Twilio SMS Gateway</text>
  <text x="86" y="480" fill="#92752f" font-size="11.5">GPS + SOS over plain text</text>
  <text x="86" y="498" fill="#92752f" font-size="11.5">zero mobile data required</text>

  <!-- Tourist PWA -> Twilio (dashed, offline) -->
  <polyline points="210,192 210,404" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowAmber)"/>
  <rect x="145" y="284" width="130" height="22" rx="6" fill="#f8fafc"/>
  <text x="210" y="299" fill="#b45309" font-size="11" text-anchor="middle">no signal → SMS</text>

  <!-- Twilio -> Backend core (solid amber, inbound webhook) -->
  <line x1="360" y1="460" x2="430" y2="460" stroke="#d97706" stroke-width="2.25" marker-end="url(#arrowAmber)"/>
  <rect x="350" y="440" width="130" height="20" rx="5" fill="#f8fafc"/>
  <text x="415" y="454" fill="#b45309" font-size="10.5" text-anchor="middle">inbound webhook</text>

  <!-- ============ LEGEND ============ -->
  <g>
    <line x1="1160" y1="668" x2="1200" y2="668" stroke="#2563eb" stroke-width="2.5"/>
    <text x="1210" y="672" fill="#475569" font-size="12">Realtime path (Socket.IO / REST)</text>
    <line x1="1160" y1="694" x2="1200" y2="694" stroke="#d97706" stroke-width="2.25" stroke-dasharray="6,5"/>
    <text x="1210" y="698" fill="#475569" font-size="12">Offline path (SMS, no data needed)</text>
  </g>

  <!-- ============ FOOTNOTE ============ -->
  <text x="800" y="700" fill="#94a3b8" font-size="13" text-anchor="middle">One backend, one source of truth — four portals see the same event the instant it happens.</text>
</svg>
