databases:
  - name: aaraksha-db
    databaseName: aaraksha
    plan: free
    region: singapore

services:
  - type: web
    name: aaraksha-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    # Migrations run on every boot — node-pg-migrate tracks applied
    # migrations in its own table, so this is idempotent, not a re-seed.
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aaraksha-db
          property: connectionString
      # The pg default of 2s is too tight for Render's free-tier Postgres —
      # idle connections get dropped between requests and re-establishing
      # one occasionally exceeds 2s, surfacing as a bare "Internal server
      # error" on the very first DB-touching request after any idle gap.
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: TOURIST_FRONTEND_URL
        value: https://aaraksha-tourist.vercel.app
      - key: GOVT_FRONTEND_URL
        value: https://aaraksha-govt.vercel.app
      - key: GUARDIAN_FRONTEND_URL
        value: https://aaraksha-guardian.vercel.app
      - key: VOLUNTEER_FRONTEND_URL
        value: https://aaraksha-rescuer.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: GOVT_ID_SECRET
        generateValue: true
      - key: GUARDIAN_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AUTH_RATE_LIMIT_MAX
        value: 5
      - key: WEBHOOK_RATE_LIMIT_MAX
        value: 1000
      - key: OTP_RATE_LIMIT_MAX
        value: 3
      - key: LOG_LEVEL
        value: info
      # Left blank to fill in only if you have real credentials — every one
      # of these degrades gracefully when unset (see config/env.js): no
      # Twilio means offline-SOS-over-SMS and OTP delivery fall back to the
      # in-app debug OTP display; no Gemini means packing lists and safety
      # briefings use their static fallback; no OWM means the weather
      # factor drops out of the TSI score; no VAPID means push
      # notifications silently no-op.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_EMERGENCY_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OWM_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:aaraksha@example.com
